[package]
name = "wrap"
version = "0.1.0"
edition = "2024"
description = "Enter a cached microVM from a layered snapshot"
publish = false

[[bin]]
name = "wrap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hostname = "0.4"
microsandbox = "0.6.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.52", features = ["full"] }
