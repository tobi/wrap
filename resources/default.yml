
# Base image. `ghcr.io/tobi/wrap:desktop` adds XFCE on :1, Chrome with CDP and
# agent-browser attached to it (see Containerfile.desktop).
image: ghcr.io/tobi/wrap:latest

# When the image stage contacts the registry: `Always` re-checks the manifest
# (first build and --rebuild only), `IfMissing` reuses a fully cached image,
# which is required for a locally built tag imported with `msb load`, and
# `Never` fails unless the image is already cached.
pull_policy: Always

build:
  cpus: 4
  memory: 4096
  memory_max: 8192

env:
  TERM: xterm-256color

secrets:
  - env: GITHUB_TOKEN
    host-env: $(gh auth token)
    hosts:
      - "*.github.com"
      - "*.githubusercontent.com"

  # - env: OPENAI_API_KEY
  #   host-env: $OPENAI_API_KEY
  #   hosts:
  #      - "api.openai.com"

network:
  allow_everything: false

  allow_host:
    - mise.run 
    - .github.com
    - .githubusercontent.com
    # GitHub's static assets (CSS/JS); without it github.com renders unstyled
    # in the desktop image's browser.
    - .githubassets.com
    - .jdx.dev
    - .pkgbuild.com
    # mise verifies GitHub artifact attestations for aqua tools via Sigstore.
    - .sigstore.dev

  # deny_host:
  #   - example.com



agents:
  - name: pi
    package: mise:pi@latest
    host-copy: 
      ~/.pi 
  - name: omp
    package: github:can1357/oh-my-pi@latest
    host-copy:
      ~/.omp
  - name: codex
    package: mise:codex@latest
    host-copy:
      ~/.claude
  - name: claude
    package: mise:claude@latest
  - name: try
    package: github:tobi/try@latest


layers:
  - id: dotfiles 
    script: | 
      # example: 
      # curl github.com/your/dotfiles | bash 
  
      echo "* You are in the vm's $SHELL"
      mise list
      echo
